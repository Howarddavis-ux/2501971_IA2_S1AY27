    <header>
        <img src = "../assets/logo-full.svg">

            <a id = "ticket-nav" class = "nav-buttons" href="login.html"><strong>Login</strong></a>

    <main id = "register-main">
        <div style="display: block;">
            <h1>Your Journey to Coding Conf 2025 Starts Here!</h1>
            <p>Secure your spot at next year's biggest coding conference.</p>
        </div>

        <form action = "" method = "">
            
            <label for = "upload-container" class = "text-label">Upload Avatar</label>
            <div class = "upload-container">
                <div class = "wrapper">
                    <label for="file-upload" class = "upload-box">
                        <div>
                            <img id = "preview" src = "../assets/icon-upload.svg">
                        </div>
                        <span id = "test">Drag and drop or click to upload</span>
                        <span id = "upload-buttons">
                            <button type="button" id="upload-options" onclick="removeImage(event)">Remove image</button>
                            <button type="button" id="upload-options" onclick="changeImage(event)">Change image</button>
                        </span>
                    </label>
                </div>
                <input type="file" accept=".png,.jpg" id="file-upload" name="uploaded_file" onchange="acceptFile(this)" hidden>
                <p id = "upload-instruction" class = "text-label instruction"><img src ="../assets/icon-info.svg">Upload your photo (JPG or PNG, max size: 500KB).</p>
            </div>

            <label for = "full-name" class = "text-label">Full Name</label>
            <div class="wrapper">
                <input type = "text"  class = "full-name text-field" name = "full_name">
            </div>

            <label for = "email-address" class = "text-label">Email Address</label>
            <div class = "wrapper">
                <input type = "text" class = "email-address text-field" name = "email_address" placeholder="example@email.com">
            </div>
            <p id = "invalid-email" class = "text-label instruction"><img src ="../assets/icon-info.svg">Please enter a valid email address</p>

            <label for="github-username" class="text-label">GitHub Username</label>
            <div class="wrapper">
                <input type="text" id="github-username" class="github-username text-field" name="github_username" placeholder="@yourusername">
            </div>
            <p id="invalid-github" class="text-label instruction"><img src="../assets/icon-info.svg" alt="info">GitHub username must start with @</p>
            
            <div class = "wrapper" style = "margin-top: 10px;">
                <button type="submit" id = "submit-button"><strong>Generate My Ticket</strong></button>
            </div>
